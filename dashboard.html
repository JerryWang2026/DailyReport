<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校准管理仪表盘</title>

<!-- ECharts：用于状态分布、到期时间线等可视化图表 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

<style>
/* ===================== 苹果极简风格设计系统 ===================== */
/* 可在下方统一修改配色、圆角、阴影等视觉变量 */
:root{
  --bg: #f5f5f7;              /* 系统浅灰底色 */
  --card: #ffffff;            /* 卡片白底 */
  --card-sub: #fbfbfd;        /* 次级卡片底 */
  --text: #1d1d1f;            /* 主文字（近黑） */
  --text-2: #6e6e73;          /* 次级文字（灰） */
  --text-3: #8e8e93;          /* 弱化文字 */
  --line: #e8e8ed;            /* 细分割线 */
  --radius: 18px;             /* 大圆角 */
  --radius-sm: 12px;
  --shadow: 0 2px 10px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.04);
  --shadow-hover: 0 2px 12px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.07);
  /* 风险分级色：红=已过期 橙=紧急预警 黄=待办 蓝=已送出 绿=正常 紫=海外 */
  --red: #ff3b30;   --red-soft:#fff0ef;
  --orange:#ff9500; --orange-soft:#fff4e6;
  --yellow:#ffcc00; --yellow-soft:#fff8e1;
  --blue:#007aff;   --blue-soft:#eaf3ff;
  --green:#34c759;  --green-soft:#eafaf0;
  --green-2:#2fb36b; --green-2-soft:#e7f7ef;
  --purple:#af52de; --purple-soft:#f6ecfb;
  --gray:#8e8e93;   --gray-soft:#f2f2f5;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
    "Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;}

.wrap{max-width:1240px;margin:0 auto;padding:34px 28px 70px;}

/* 顶部栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.topbar h1{font-size:26px;font-weight:600;letter-spacing:-.3px}
.topbar .sub{font-size:13px;color:var(--text-3);margin-top:3px}
.topbar .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{border:none;cursor:pointer;font-size:13px;font-weight:500;padding:9px 16px;
  border-radius:980px;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#0a6ee0}
.btn-ghost{background:var(--gray-soft);color:var(--text)}
.btn-ghost:hover{background:#e6e6ea}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft:hover{background:#dcebff}

.refresh-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.refresh-dot.loading{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 区块标题 */
.section-title{font-size:19px;font-weight:600;margin:30px 0 14px;display:flex;align-items:center;gap:8px}
.section-title .bar{width:4px;height:18px;border-radius:3px;background:var(--blue)}
.section-sub{font-size:13px;color:var(--text-3);font-weight:400;margin-left:4px}

/* ===================== 总览卡片 ===================== */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);
  transition:.2s;position:relative;overflow:hidden}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card .label{font-size:13px;color:var(--text-2);font-weight:500}
.card .value{font-size:40px;font-weight:700;letter-spacing:-1px;margin-top:6px;line-height:1}
.card .hint{font-size:12px;color:var(--text-3);margin-top:8px}
.card .icon{position:absolute;top:18px;right:20px;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px}
.card.accent-blue .icon{background:var(--blue-soft);color:var(--blue)}
.card.accent-gray .icon{background:var(--gray-soft);color:var(--gray)}
.card.accent-purple .icon{background:var(--purple-soft);color:var(--purple)}
.card.accent-red{background:var(--red-soft)} .card.accent-red .value{color:var(--red)} .card.accent-red .icon{background:#ffe3e1;color:var(--red)}
.card.accent-orange{background:var(--orange-soft)} .card.accent-orange .value{color:var(--orange)} .card.accent-orange .icon{background:#ffe9cc;color:var(--orange)}
.card.accent-orange2{background:var(--orange-soft)} .card.accent-orange2 .value{color:var(--orange)} .card.accent-orange2 .icon{background:#ffe9cc;color:var(--orange)}

/* ===================== 每日待办预警区 ===================== */
.alert-zone{display:grid;grid-template-columns:1fr;gap:12px}
.alert-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.alert-group .head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:980px}
.badge.red{background:#ffe3e1;color:var(--red)}
.badge.orange{background:#ffe9cc;color:var(--orange)}
.badge.yellow{background:#fff3cc;color:#b58900}
.alert-list{max-height:300px;overflow:auto}
.alert-row{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:none}
.alert-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.red{background:var(--red)} .dot.orange{background:var(--orange)} .dot.yellow{background:var(--yellow)}
.alert-row .info{flex:1;min-width:0}
.alert-row .info .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-row .info .s{font-size:12px;color:var(--text-3)}
.alert-row .due{font-size:12px;color:var(--text-2);text-align:right;flex:none}
.alert-row .days{font-size:20px;font-weight:700;flex:none;min-width:64px;text-align:right}
.days.red{color:var(--red)} .days.orange{color:var(--orange)} .days.yellow{color:#b58900}
.empty{padding:24px;text-align:center;color:var(--text-3);font-size:13px}

/* ===================== 通用表格/列表 ===================== */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 6px 8px;margin-top:6px}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:980px;
  padding:9px 14px 9px 36px;font-size:13px;color:var(--text);outline:none;transition:.15s}
.search input:focus{border-color:var(--blue);background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
select,.mini{border:1px solid var(--line);background:#fff;border-radius:980px;padding:8px 14px;font-size:13px;color:var(--text);outline:none;cursor:pointer}
select:focus{border-color:var(--blue)}

.tbl-wrap{overflow:auto;max-height:460px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--card-sub);text-align:left;padding:11px 14px;
  font-weight:600;color:var(--text-2);border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;z-index:2}
tbody td{padding:10px 14px;border-bottom:1px solid #f3f3f5;white-space:nowrap}
tbody tr:hover{background:var(--card-sub)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:980px;line-height:1.6}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.green-2{background:var(--green-2-soft);color:var(--green-2)}
.tag.gray{background:var(--gray-soft);color:var(--gray)}
.tag.red{background:#ffe3e1;color:var(--red)}
.tag.orange{background:#ffe9cc;color:var(--orange)}
.tag.yellow{background:#fff3cc;color:#b58900}

/* ===================== 图表 ===================== */
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chart-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 6px}
.chart-card h4{font-size:14px;font-weight:600;margin-bottom:4px}
.chart{height:240px;width:100%}

/* 两列布局 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
}
.footer{text-align:center;color:var(--text-3);font-size:12px;margin-top:40px}
.hidden{display:none!important}
.kpi-note{font-size:12px;color:var(--text-3);margin-top:4px;padding:0 2px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== 顶部栏 ===================== -->
  <div class="topbar">
    <div>
      <h1>校准管理仪表盘</h1>
      <div class="sub" id="subDate">— 加载中 · 仅统计 Active 有效设备</div>
    </div>
    <div class="actions">
      <span class="refresh-dot" id="refreshDot" title="数据状态"></span>
      <span class="kpi-note" id="srcInfo"></span>
      <button class="btn btn-soft" onclick="refreshData()">↻ 刷新</button>
    </div>
  </div>

  <!-- ===================== 1. 总览卡片 ===================== -->
  <div class="section-title"><span class="bar"></span>总览看板
    <span class="section-sub" id="srcSub"></span></div>
  <div class="cards" id="cards"></div>

  <!-- ===================== 2. 每日待办预警区 ===================== -->
  <div class="section-title"><span class="bar" style="background:var(--red)"></span>每日待办预警
    <span class="section-sub">按紧急程度排序，优先处理红色风险</span></div>
  <div class="alert-zone" id="alertZone"></div>

  <!-- ===================== 3. 已送出校准设备专区 ===================== -->
  <div class="section-title"><span class="bar" style="background:var(--blue)"></span>已送检待返回
    <span class="section-sub">有 Send Date 且已过期的设备（仍未返回）</span></div>
  <div class="panel">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="sentSearch" placeholder="搜索 编号 / 型号 / 送出日期…" oninput="renderSent()">
      </div>
      <select id="sentScope" onchange="renderSent()">
        <option value="all">全部</option>
        <option value="domestic">国内校准</option>
        <option value="oversea">海外校准</option>
      </select>
      <button class="mini btn-ghost btn" onclick="exportCSV(getSentView(),'已送检待返回')">导出 CSV</button>
    </div>
    <div class="tbl-wrap"><table id="sentTbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <!-- ===================== 4. 海外校准专属专区 ===================== -->
  <div class="section-title"><span class="bar" style="background:var(--purple)"></span>海外校准专区
    <span class="section-sub">需提前 1 个月准备送样、报关流程</span></div>
  <div class="panel">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="osSearch" placeholder="搜索 编号 / 型号 / 厂商…" oninput="renderOversea()">
      </div>
      <select id="osScope" onchange="renderOversea()">
        <option value="action" selected>近一个月需动作</option>
        <option value="all">全部海外</option>
        <option value="pending">待送出（≤30天预警）</option>
        <option value="sent">已送检待返回</option>
      </select>
      <button class="mini btn-ghost btn" onclick="exportCSV(getOverseaView(),'海外校准')">导出 CSV</button>
    </div>
    <div class="tbl-wrap"><table id="osTbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <!-- ===================== 5. 全量明细 + 图表 ===================== -->
  <div class="section-title"><span class="bar"></span>全量设备明细
    <span class="section-sub">仅 Active 设备</span></div>
  <div class="panel">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="allSearch" placeholder="搜索 编号 / 型号 / 描述…" oninput="renderAll()">
      </div>
      <select id="statusFilter" onchange="renderAll()">
        <option value="all">全部状态</option>
        <option value="expired">已过期</option>
        <option value="pending">待送出</option>
        <option value="sent">已送检</option>
        <option value="returned">已返回</option>
      </select>
      <select id="scopeFilter" onchange="renderAll()">
        <option value="all">境内+海外</option>
        <option value="domestic">仅国内</option>
        <option value="oversea">仅海外</option>
      </select>
      <button class="mini btn-ghost btn" onclick="exportCSV(getAllView(),'全量设备')">导出 CSV</button>
    </div>
    <div class="tbl-wrap"><table id="allTbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="section-title"><span class="bar"></span>可视化分析</div>
  <div class="charts">
    <div class="chart-card"><h4>设备状态分布</h4><div class="chart" id="chartStatus"></div></div>
    <div class="chart-card"><h4>国内 / 海外校准占比</h4><div class="chart" id="chartScope"></div></div>
    <div class="chart-card"><h4>到期月份分布</h4><div class="chart" id="chartDue"></div></div>
  </div>

  <div class="footer">校准管理仪表盘 · 数据以本地 Excel 为准 · 仅统计 Active 设备</div>
</div>

<script src="data.js"></script>

// 解析日期：兼容 "2026-07-10"、"2026-07-10 14:30:00"、"10-Jul-26"、"7/10/2026" 等
function parseDate(v){
  if(v==null) return null;
  if(v instanceof Date) return v;
  if(typeof v==='object' && v.constructor && (v.constructor.name==='Date')) return v;
  // Excel 日期序列号（个别情况）
  if(typeof v==='number'){
    if(v>20000 && v<80000){ const dt=new Date((v-25569)*86400000); return isNaN(dt)?null:dt; }
    return null;
  }
  let s=String(v).trim();
  if(!s || /^(none|null|nan|)$/i.test(s)) return null;
  // 去掉尾部时间（如 "2026-07-10 14:30:00" -> "2026-07-10"）
  s=s.replace(/\s+\d{1,2}:\d{2}(:\d{2})?.*$/,'').trim();
  const pivot = (new Date().getFullYear()%100)+15; // 2位年补世纪阈值（如2026->41）

  // 1) 数字分隔格式
  const m=s.match(/(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/);
  if(m){
    const g=[+m[1],+m[2],+m[3]];
    const cy=new Date().getFullYear();
    const fix=y=> y<100 ? y+(y<=pivot?2000:1900) : y;
    // 优先：存在 4 位数段，则该段为年份（修复 Y/m/d 单日错位）
    const yi=g.findIndex(x=>x>=1000);
    if(yi>=0){
      const y=fix(g[yi]); const md=g.filter((_,i)=>i!==yi);
      let dt=new Date(y, md[0]-1, md[1]);
      if(!isNaN(dt) && dt.getFullYear()===y && dt.getMonth()===md[0]-1) return dt;
      dt=new Date(y, md[1]-1, md[0]);            // 月日颠倒再试
      if(!isNaN(dt)) return dt;
    }
    // 全 2 位数（如 10/05/80）：枚举年份所在位置，选年份最接近今年的合法日期
    const cands=[];
    for(let yi2=0; yi2<3; yi2++){
      const y=fix(g[yi2]); const md=g.filter((_,i)=>i!==yi2);
      for(const [mo,d] of [[md[0],md[1]],[md[1],md[0]]]){
        if(mo>=1 && mo<=12 && d>=1 && d<=31){
          const dt=new Date(y, mo-1, d);
          if(!isNaN(dt) && dt.getFullYear()===y && dt.getMonth()===mo-1)
            cands.push({dt, dist:Math.abs(y-cy)});
        }
      }
    }
    if(cands.length){
      cands.sort((a,b)=> a.dist-b.dist || a.dt - b.dt);
      return cands[0].dt;
    }
    return null;
  }
  // 2) 英文月份缩写："05-Oct-80" / "5-Oct-2026"
  const m2=s.match(/(\d{1,2})[-/\s.]([A-Za-z]{3})[-/\s.](\d{2,4})/i);
  if(m2){
    const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    let y=+m2[3]; if(y<100) y += (y<=pivot?2000:1900);
    const dt=new Date(y, MON[m2[2].toLowerCase()], +m2[1]);
    if(!isNaN(dt)) return dt;
  }
  const t=Date.parse(s); return isNaN(t)?null:new Date(t);
}
function tryFmt(s,f){
  try{
    const map={Y:'([0-9]{4})',y:'([0-9]{2})',m:'([0-9]{1,2})',d:'([0-9]{1,2})',b:'([A-Za-z]{3})'};
    let re='^'+f.replace(/[Yymdb]/g,x=>map[x])+'$';
    const mm=s.match(new RegExp(re));
    if(!mm) return null;
    let y,mo,d;
    const parts=f.match(/[Yymdb]/g);
    const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    parts.forEach((p,i)=>{
      const val=mm[i+1];
      if(p==='Y') y=+val; if(p==='y') y=2000+ +val;
      if(p==='m') mo=+val-1; if(p==='b') mo=MON[val.toLowerCase()];
      if(p==='d') d=+val;
    });
    return new Date(y,mo,d);
  }catch(e){return null;}
}

function fmtClock(d){ return d? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}` : '—'; }
function days(a,b){ return Math.round((stripTime(b)-stripTime(a))/86400000); }
function stripTime(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function isActive(dev){ return dev.active && String(dev.active).trim().toLowerCase()==='active'; }
function isFluke57xx(dev){
  const maker = String(dev.manufacture||'').trim().toLowerCase();
  const model = String(dev.model||'').trim().toUpperCase();
  return maker==='fluke' && /^57\d{2}[A-Z]?$/.test(model);
}
function parseExternalDueFromComments(comments){
  const s = String(comments||'');
  const explicit = s.match(/EXT_DUE\s*=\s*([0-9]{4}-[0-9]{2}-[0-9]{2})/i);
  if(explicit) return parseDate(explicit[1]);

  const nextCal = s.match(/next\s+cal\s+dat[ea]\s*[:=]?\s*([0-9]{1,2}-[A-Za-z]{3}-[0-9]{2,4}|[0-9]{4}[\/-][0-9]{1,2}[\/-][0-9]{1,2}|[0-9]{1,2}[\/-][0-9]{1,2}[\/-][0-9]{2,4})/i);
  if(nextCal) return parseDate(nextCal[1]);

  const anyDate = s.match(/([0-9]{1,2}-[A-Za-z]{3}-[0-9]{2,4}|[0-9]{4}[\/-][0-9]{1,2}[\/-][0-9]{1,2}|[0-9]{1,2}[\/-][0-9]{1,2}[\/-][0-9]{2,4})/i);
  return anyDate ? parseDate(anyDate[1]) : null;
}

/* ===================== 设备计算（核心逻辑） ===================== */
function compute(dev){
  const due = parseDate(dev.due);
  const send = parseDate(dev.sendDate);
  const calDate = parseDate(dev.calDate);
  const isSent = !!send;
  const isOversea = !!(dev.oversea && String(dev.oversea).trim()!=='');
  const duePast = due && due < stripTime(TODAY);
  const is57xx = isFluke57xx(dev);
  const externalDue = is57xx ? parseExternalDueFromComments(dev.comments) : null;
  const externalDuePast = externalDue && externalDue < stripTime(TODAY);

  let status, daysN, sortKey;
  if(!isSent && duePast){            // 已过期未送出
    status='expired'; daysN=days(due,TODAY); sortKey=0;
  } else if(!isSent && due){
    const d=days(TODAY,due);
    const warn = isOversea? CONFIG.OVERSEA_WARN : CONFIG.DOMESTIC_WARN;
    status='pending'; daysN=d; sortKey= (d<=warn)?1:2;
  } else if(isSent && duePast){      // 已送检且仍未返回（已过期）
    status='sent'; daysN=days(send,TODAY); sortKey=3;
  } else if(isSent && !duePast){     // 已送检且已返回（到期日已刷新 → 视为正常在用）
    status='returned'; daysN=days(send,TODAY); sortKey=5;
  } else {
    status='pending'; daysN=due?days(TODAY,due):null; sortKey=2;
  }
  const remainDue = (due && !duePast)? days(TODAY,due) : null;
  const externalRemain = (externalDue && !externalDuePast)? days(TODAY,externalDue) : null;
  // 逾期天数：已送检/已过期 且 仍未返回（今天 − 到期日，正数）
  const overdueDays = (due && duePast)? days(due,TODAY) : null;
  return {...dev, due, send, calDate, isSent, isOversea, duePast, status, daysN, remainDue, overdueDays, sortKey, is57xx, externalDue, externalRemain};
}

/* ===================== 主构建 ===================== */
function buildAll(){
  if(!RAW) return;
  TODAY = new Date();
  const devices = RAW.standards.filter(isActive).map(compute)
                .sort((a,b)=> a.sortKey-b.sortKey || (a.daysN??999)-(b.daysN??999));
  const oversea = RAW.overseas.map(o=>({...o, _due:parseDate(o.due||o.date), _send:parseDate(o.sendDate||o.date)}));

  document.getElementById('subDate').textContent =
    `${fmt(TODAY)} · 共 ${devices.length} 台有效设备 · 仅统计 Active`;
  document.getElementById('srcSub').textContent =
    RAW.source? `数据源：${RAW.source}` : '（内置示例数据）';
  document.getElementById('srcInfo').textContent =
    `数据更新于 ${RAW.generatedAt||'—'} · 页面刷新于 ${fmtClock(LAST_REFRESH_AT||TODAY)}`;

  renderCards(devices);
  renderAlerts(devices);
  renderSent();
  renderOversea();
  renderAll();
  renderCharts(devices);
  document.getElementById('refreshDot').classList.remove('loading');
}
function refreshData(){
  const dot = document.getElementById('refreshDot');
  if(dot) dot.classList.add('loading');
  LAST_REFRESH_AT = new Date();

  const script = document.createElement('script');
  script.src = `data.js?t=${Date.now()}`;
  script.onload = ()=>{
    RAW = (typeof __AUTO_DATA__ !== 'undefined') ? __AUTO_DATA__ : RAW;
    LAST_REFRESH_AT = new Date();
    buildAll();
  };
  script.onerror = ()=>{
    if(dot) dot.classList.remove('loading');
    alert('刷新失败：未能重新读取 data.js');
  };
  document.head.appendChild(script);
}

/* ---------- 1. 总览卡片 ---------- */
function renderCards(devs){
  const total=devs.length;
  const sent=devs.filter(d=>d.isSent && d.duePast);          // 已送检且仍未返回（逾期）
  const returned=devs.filter(d=>d.status==='returned');      // 已送检且已返回
  const pending=devs.filter(d=>!d.isSent && d.status==='pending');
  const expired=devs.filter(d=>d.status==='expired');
  const dom7=devs.filter(d=>!d.isOversea && !d.isSent && d.remainDue!=null && d.remainDue<=CONFIG.DOMESTIC_WARN && d.remainDue>=0);
  const os30=devs.filter(d=>d.isOversea && !d.isSent && d.remainDue!=null && d.remainDue<=CONFIG.OVERSEA_WARN && d.remainDue>=0);
  const cards=[
    {cls:'accent-blue',   icon:'📦', label:'有效设备总数', val:total, hint:'Active 状态设备'},
    {cls:'accent-gray',   icon:'🗓️', label:'待送出校准', val:pending.length, hint:'未到期 · 无 Send Date'},
    {cls:'accent-purple', icon:'🚚', label:'已送检待返回', val:sent.length, hint:'有 Send Date · 已过期未返回'},
    {cls:'accent-red',    icon:'⚠️', label:'已过期高风险', val:expired.length, hint:'已过 Due · 仍未送出'},
    {cls:'accent-orange', icon:'⏰', label:'国内≤'+CONFIG.DOMESTIC_WARN+'天预警', val:dom7.length, hint:'尽快安排送出'},
    {cls:'accent-orange2',icon:'🌐', label:'海外≤'+CONFIG.OVERSEA_WARN+'天预警', val:os30.length, hint:'需提前1个月准备'},
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>`
    <div class="card ${c.cls}">
      <div class="icon">${c.icon}</div>
      <div class="label">${c.label}</div>
      <div class="value">${c.val}</div>
      <div class="hint">${c.hint}</div>
    </div>`).join('');
}

/* ---------- 2. 每日待办预警 ---------- */
function alertRow(d,level,msg){
  const dot = level==='red'?'red':level==='orange'?'orange':'yellow';
  const dcls = level==='red'?'red':level==='orange'?'orange':'yellow';
  const dayTxt = d.status==='expired'
      ? `逾期 ${Math.abs(d.daysN)} 天`
      : `剩 ${d.daysN} 天`;
  const extTxt = d.externalDue ? ` · 外送 Due ${fmt(d.externalDue)}` : '';
  return `<div class="alert-row">
    <span class="dot ${dot}"></span>
    <div class="info">
      <div class="t">${esc(d.model||d.description||d.sn||'—')} <span style="color:var(--text-3);font-weight:400">· ID ${esc(d.id||'—')} · SN ${esc(d.sn||'—')}</span></div>
      <div class="s">${msg} · Due ${fmt(d.due)}${extTxt}</div>
    </div>
    <div class="days ${dcls}">${dayTxt}</div>
  </div>`;
}
function renderAlerts(devs){
  const expired = devs.filter(d=>d.status==='expired');
  const domWarn = devs.filter(d=>!d.isOversea && !d.isSent && d.remainDue!=null && d.remainDue>=0 && d.remainDue<=CONFIG.DOMESTIC_WARN);
  const osWarn  = devs.filter(d=>d.isOversea && !d.isSent && d.remainDue!=null && d.remainDue>=0 && d.remainDue<=CONFIG.OVERSEA_WARN);
  const pend    = devs.filter(d=>!d.isSent && !d.status==='expired' && (d.remainDue==null || d.remainDue>CONFIG.DOMESTIC_WARN));

  const groups=[];
  groups.push({title:`🔴 红色高风险 · 已过期未召回`, badge:`${expired.length} 台`, cls:'red',
    body: expired.length? expired.map(d=>alertRow(d,'red','⚠️ 立即召回并安排校准')).join('') : '<div class="empty">无 · 全部在控 ✅</div>'});
  groups.push({title:`🟠 国内紧急预警 · ≤${CONFIG.DOMESTIC_WARN}天`, badge:`${domWarn.length} 台`, cls:'orange',
    body: domWarn.length? domWarn.map(d=>alertRow(d,'orange','尽快安排送出校准')).join('') : '<div class="empty">暂无国内紧急预警</div>'});
  groups.push({title:`🟠 海外紧急预警 · ≤${CONFIG.OVERSEA_WARN}天`, badge:`${osWarn.length} 台`, cls:'orange',
    body: osWarn.length? osWarn.map(d=>alertRow(d,'orange','海外需提前1个月准备，立即启动送样')).join('') : '<div class="empty">暂无海外紧急预警</div>'});
  groups.push({title:`🟡 待办提醒 · 待安排校准`, badge:`${pend.length} 台`, cls:'yellow',
    body: pend.length? pend.slice(0,50).map(d=>alertRow(d,'yellow','近期需安排校准')).join('') : '<div class="empty">无</div>'});

  document.getElementById('alertZone').innerHTML = groups.map(g=>`
    <div class="alert-group">
      <div class="head">${g.title} <span class="badge ${g.cls}">${g.badge}</span></div>
      <div class="alert-list">${g.body}</div>
    </div>`).join('');
}

/* ---------- 3. 已送检待返回 ---------- */
function getSentView(){
  const scope=document.getElementById('sentScope').value;
  const q=document.getElementById('sentSearch').value.trim().toLowerCase();
  return RAW.standards.filter(isActive).map(compute)
    .filter(d=>d.isSent && d.duePast)
    .filter(d=> scope==='all' || (scope==='domestic'&&!d.isOversea) || (scope==='oversea'&&d.isOversea))
    .filter(d=> !q || `${d.sn} ${d.model} ${d.description} ${fmt(d.send)}`.toLowerCase().includes(q))
    .sort((a,b)=>a.daysN-b.daysN);
}
const SENT_COLS=[['id','ID'],['sn','SN'],['model','型号'],['manufacture','厂商'],['description','描述'],['externalDue','外送Due'],
  ['sendDate','送出日期'],['daysN','送检天数'],['due','到期日'],['overdueDays','逾期天数'],['scope','类型']];
function renderSent(){
  const rows=getSentView();
  const head=SENT_COLS.map(c=>`<th>${c[1]}</th>`).join('');
  const body=rows.map(d=>`<tr>
    <td>${esc(d.id||'—')}</td><td>${esc(d.sn||'—')}</td><td>${esc(d.model||'—')}</td><td>${esc(d.manufacture||'—')}</td>
    <td>${esc(d.description||'—')}</td><td>${fmt(d.externalDue)}</td><td>${fmt(d.send)}</td>
    <td><b>${d.daysN}</b> 天</td><td>${fmt(d.due)}</td>
    <td>${d.overdueDays!=null?`<span style="color:#e5484d;font-weight:600">逾期 ${d.overdueDays} 天</span>`:'—'}</td>
    <td>${d.isOversea?'<span class="tag purple">海外</span>':'<span class="tag blue">国内</span>'}</td>
  </tr>`).join('') || '<tr><td colspan="11" class="empty">无数据</td></tr>';
  document.getElementById('sentTbl').querySelector('thead').innerHTML=`<tr>${head}</tr>`;
  document.getElementById('sentTbl').querySelector('tbody').innerHTML=body;
}

/* ---------- 4. 海外校准专区 ---------- */
function getOverseaView(){
  const scope=document.getElementById('osScope').value;
  const q=document.getElementById('osSearch').value.trim().toLowerCase();
  let rows = RAW.standards.filter(isActive).map(compute).filter(d=>d.isOversea);
  if(scope==='pending') rows=rows.filter(d=>!d.isSent && d.remainDue!=null && d.remainDue<=CONFIG.OVERSEA_WARN);
  if(scope==='sent') rows=rows.filter(d=>d.isSent && d.duePast);
  // 近一个月需要动作：待送出(≤30天预警) 或 已送检但仍未返回(逾期)
  if(scope==='action') rows=rows.filter(d=> (!d.isSent && d.remainDue!=null && d.remainDue>=0 && d.remainDue<=CONFIG.OVERSEA_WARN) || (d.isSent && d.duePast));
  return rows.filter(d=> !q || `${d.sn} ${d.model} ${d.manufacture} ${d.description}`.toLowerCase().includes(q))
    .sort((a,b)=> (a.sortKey-b.sortKey) || (a.remainDue??999)-(b.remainDue??999));
}
const OS_COLS=[['id','ID'],['sn','SN'],['model','型号'],['manufacture','厂商'],['oversea','海外厂商'],['externalDue','外送Due'],
  ['sendDate','送出日期'],['daysN','送检天数'],['due','到期日'],['overdueDays','剩余/逾期'],['status','状态']];
function renderOversea(){
  const rows=getOverseaView();
  const head=OS_COLS.map(c=>`<th>${c[1]}</th>`).join('');
  const body=rows.map(d=>{
        let st = d.status==='sent'?'<span class="tag purple">已送出</span>'
          : d.status==='returned'?'<span class="tag green-2">已返回</span>'
          : d.remainDue!=null && d.remainDue<=CONFIG.OVERSEA_WARN?'<span class="tag orange">⏰预警</span>'
          : '<span class="tag gray">待安排</span>';
    return `<tr>
      <td>${esc(d.id||'—')}</td><td>${esc(d.sn||'—')}</td><td>${esc(d.model||'—')}</td><td>${esc(d.manufacture||'—')}</td>
      <td>${esc(d.oversea||'—')}</td><td>${fmt(d.externalDue)}</td><td>${fmt(d.send)||'—'}</td>
      <td>${d.isSent?d.daysN+' 天':'—'}</td><td>${fmt(d.due)}</td>
      <td>${d.overdueDays!=null?`<span style="color:#e5484d;font-weight:600">逾期${d.overdueDays}天</span>`:(d.remainDue!=null?d.remainDue+' 天':'—')}</td><td>${st}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="11" class="empty">无海外校准设备</td></tr>';
  document.getElementById('osTbl').querySelector('thead').innerHTML=`<tr>${head}</tr>`;
  document.getElementById('osTbl').querySelector('tbody').innerHTML=body;
}

/* ---------- 5. 全量明细 ---------- */
function getAllView(){
  const sf=document.getElementById('statusFilter').value;
  const sc=document.getElementById('scopeFilter').value;
  const q=document.getElementById('allSearch').value.trim().toLowerCase();
  return RAW.standards.filter(isActive).map(compute)
    .filter(d=> sf==='all' || d.status===sf)
    .filter(d=> sc==='all' || (sc==='domestic'&&!d.isOversea) || (sc==='oversea'&&d.isOversea))
    .filter(d=> !q || `${d.sn} ${d.model} ${d.description} ${d.manufacture}`.toLowerCase().includes(q))
    .sort((a,b)=> a.sortKey-b.sortKey || (a.daysN??999)-(b.daysN??999));
}
const ALL_COLS=[['id','ID'],['sn','SN'],['model','型号'],['manufacture','厂商'],['description','描述'],['externalDue','外送Due'],
  ['due','到期日'],['sendDate','送出日期'],['scope','类型'],['status','状态']];
function statusTag(d){
  if(d.status==='expired') return '<span class="tag red">已过期</span>';
  if(d.status==='sent') return '<span class="tag blue">已送检</span>';
  if(d.status==='returned') return '<span class="tag green-2">已返回</span>';
  if(d.remainDue!=null && d.remainDue<=CONFIG.DOMESTIC_WARN && !d.isOversea) return '<span class="tag green">待送出</span>';
  if(d.isOversea && d.remainDue!=null && d.remainDue<=CONFIG.OVERSEA_WARN) return '<span class="tag orange">海外预警</span>';
  return '<span class="tag green">正常</span>';
}
function renderAll(){
  const rows=getAllView();
  const head=ALL_COLS.map(c=>`<th>${c[1]}</th>`).join('');
  const body=rows.map(d=>`<tr>
    <td>${esc(d.id||'—')}</td><td>${esc(d.sn||'—')}</td><td>${esc(d.model||'—')}</td><td>${esc(d.manufacture||'—')}</td>
    <td>${esc(d.description||'—')}</td><td>${fmt(d.externalDue)}</td><td>${fmt(d.due)}</td><td>${fmt(d.send)||'—'}</td>
    <td>${d.isOversea?'<span class="tag purple">海外</span>':'<span class="tag gray">国内</span>'}</td>
    <td>${statusTag(d)}</td>
  </tr>`).join('') || '<tr><td colspan="10" class="empty">无数据</td></tr>';
  document.getElementById('allTbl').querySelector('thead').innerHTML=`<tr>${head}</tr>`;
  document.getElementById('allTbl').querySelector('tbody').innerHTML=body;
}

/* ---------- 可视化 ---------- */
function renderCharts(devs){
  const statusCnt={expired:0,sent:0,pending:0,returned:0};
  devs.forEach(d=>statusCnt[d.status]++);
  const dom=devs.filter(d=>!d.isOversea).length;
  const os=devs.filter(d=>d.isOversea).length;
  const dueMon={};
  devs.forEach(d=>{ if(d.due){ const k=`${d.due.getFullYear()}-${String(d.due.getMonth()+1).padStart(2,'0')}`; dueMon[k]=(dueMon[k]||0)+1; }});
  const monKeys=Object.keys(dueMon).sort();

  drawPie('chartStatus', '设备状态分布',
    [['已过期',statusCnt.expired,C.red],['已送检',statusCnt.sent,C.blue],['待送出',statusCnt.pending,C.green],['已返回',statusCnt.returned,C.green2]]);
  drawPie('chartScope', '境内 / 海外',
    [['国内',dom,C.blue],['海外',os,C.purple]]);
  const el=document.getElementById('chartDue');
  charts.due = charts.due||echarts.init(el);
  charts.due.setOption({
    tooltip:{trigger:'axis'}, grid:{left:40,right:16,top:18,bottom:30},
    xAxis:{type:'category',data:monKeys,axisLabel:{color:C.text2,fontSize:11},axisLine:{lineStyle:{color:C.line}}},
    yAxis:{type:'value',axisLabel:{color:C.text2,fontSize:11},splitLine:{lineStyle:{color:C.line}}},
    series:[{type:'bar',data:monKeys.map(k=>dueMon[k]),itemStyle:{color:C.blue,borderRadius:[6,6,0,0]}}]
  });
}
function drawPie(id,title,items){
  const el=document.getElementById(id);
  charts[id]=charts[id]||echarts.init(el);
  charts[id].setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
    legend:{bottom:0,textStyle:{color:C.text2,fontSize:11},itemWidth:10,itemHeight:10},
    series:[{type:'pie',radius:['46%','72%'],center:['50%','44%'],
      label:{show:true,formatter:'{b}\n{c}',color:C.text,fontSize:11},
      data:items.filter(i=>i[1]>0).map(i=>({name:i[0],value:i[1],itemStyle:{color:i[2]}}))
    }]
  });
}

/* ---------- 工具 ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function exportCSV(rows,prefix){
  if(!rows.length){ alert('当前筛选无数据'); return; }
  const cols = prefix==='海外校准'?OS_COLS : prefix==='已送检待返回'?SENT_COLS : ALL_COLS;
  const head=cols.map(c=>c[1]).join(',');
  const body=rows.map(r=>cols.map(c=>{
    let v=r[c[0]]; if(c[0]==='due'||c[0]==='sendDate'||c[0]==='externalDue') v=fmt(v)||'';
    if(c[0]==='scope') v=r.isOversea?'海外':'国内';
    if(c[0]==='status') v={expired:'已过期',sent:'已送检',pending:'待送出'}[r.status]||r.status;
    return `"${String(v??'').replace(/"/g,'""')}"`;
  }).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`${prefix}_${fmt(TODAY)}.csv`; a.click();
}

/* ---------- 初始化：自动加载 data.js，否则使用内置示例数据 ---------- */
RAW = (typeof __AUTO_DATA__ !== 'undefined') ? __AUTO_DATA__ : EMBEDDED_DATA;
buildAll();
window.addEventListener('resize',()=>{ Object.values(charts).forEach(c=>c&&c.resize()); });
